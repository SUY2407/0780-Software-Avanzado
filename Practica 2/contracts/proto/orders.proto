syntax = "proto3";

package orders;

// --- Mensajes Comunes (Duplicados para independencia) ---
message Package {
  double weight_kg = 1;
  double height_cm = 2;
  double width_cm = 3;
  double length_cm = 4;
  bool fragile = 5;
  double declared_value_q = 6;
}

message Discount {
  string type = 1; 
  double value = 2;
}

message PriceBreakdown {
  double base_subtotal = 1;
  double service_subtotal = 2;
  double fragile_surcharge = 3;
  double insurance_surcharge = 4;
  double subtotal_with_surcharges = 5;
  double discount_amount = 6;
  double total = 7;
}
// --------------------------------------------------------

// Estructura completa de una Orden
message Order {
  string order_id = 1;
  string created_at = 2;
  string origin_zone = 3;
  string destination_zone = 4;
  string service_type = 5;
  string status = 6; // ACTIVE, CANCELLED
  repeated Package packages = 7;
  Discount discount = 8;
  bool insurance_enabled = 9;
  PriceBreakdown breakdown = 10; // Calculado por Pricing
  double total = 11;
}

// Request: Crear Orden
message CreateOrderRequest {
  string origin_zone = 1;
  string destination_zone = 2;
  string service_type = 3;
  repeated Package packages = 4;
  Discount discount = 5;
  bool insurance_enabled = 6;
}

// Request: Obtener/Cancelar Orden por ID
message OrderIdRequest {
  string order_id = 1;
}

// Request: Listar (sin paginación compleja por ahora)
message ListOrdersRequest {}

message ListOrdersResponse {
  repeated Order orders = 1;
}

service OrdersService {
  rpc CreateOrder (CreateOrderRequest) returns (Order);
  rpc GetOrder (OrderIdRequest) returns (Order);
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);
  rpc CancelOrder (OrderIdRequest) returns (Order);
}
