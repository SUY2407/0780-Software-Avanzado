apiVersion: apps/v1
kind: Deployment
metadata:
  name: receipt
  labels:
    app: receipt
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: receipt
  template:
    metadata:
      labels:
        app: receipt
        tier: backend
    spec:
      containers:
        - name: receipt
          image: 11erick21/receipt:2.0
          imagePullPolicy: Always
          ports:
            - name: http-health
              containerPort: 3000
            - name: grpc
              containerPort: 50053
          envFrom:
            - configMapRef:
                name: receipt-config
            - secretRef:
                name: receipt-secrets

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
