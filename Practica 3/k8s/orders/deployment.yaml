apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    app: orders
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
        tier: backend
    spec:
      containers:
        - name: orders
          image: 11erick21/orders:2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
              name: grpc
              protocol: TCP
          env:
            - name: GRPC_PORT
              value: "50051"
            - name: PRICING_SERVICE_URL
              value: "pricing:50052"
            - name: MSSQL_HOST
              value: "mssql"
            - name: MSSQL_PORT
              value: "1433"
            - name: MSSQL_DATABASE
              value: "QuetzalShipDB"
            - name: MSSQL_USER
              value: "sa"
            - name: MSSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orders-secret
                  key: SA_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps aux | grep node || exit 1"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "ps aux | grep node || exit 1"
            initialDelaySeconds: 10
            periodSeconds: 5
      restartPolicy: Always
