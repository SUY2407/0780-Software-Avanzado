apiVersion: batch/v1
kind: Job
metadata:
  name: mssql-init-job
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mssql-init
          image: mcr.microsoft.com/mssql/server:2022-latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "Esperando a que SQL Server esté disponible..."
              for i in {1..60}; do
                /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1
                if [ $? -eq 0 ]; then
                  echo "SQL Server está listo!"
                  break
                fi
                echo "Intento $i: SQL Server no está listo, esperando..."
                sleep 5
              done
              
              echo "Ejecutando script de inicialización..."
              /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$MSSQL_SA_PASSWORD" -C -i /usr/src/app/init-db.sql
              
              if [ $? -eq 0 ]; then
                echo "Base de datos inicializada correctamente!"
              else
                echo "Error al inicializar la base de datos"
                exit 1
              fi
          env:
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mssql-secret
                  key: MSSQL_SA_PASSWORD
          volumeMounts:
            - name: init-script
              mountPath: /usr/src/app
      volumes:
        - name: init-script
          configMap:
            name: mssql-init-config