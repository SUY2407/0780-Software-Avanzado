apiVersion: v1
kind: ConfigMap
metadata:
  name: mssql-init-config
data:
  init-db.sql: |
    -- Wait for SQL Server to start
    WAITFOR DELAY '00:00:05';
    GO

    -- Create database if not exists
    IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'QuetzalShipDB')
    BEGIN
        CREATE DATABASE QuetzalShipDB;
    END
    GO

    USE QuetzalShipDB;
    GO

    -- Create Orders table
    IF NOT EXISTS (SELECT * FROM sys.tables WHERE name = 'Orders')
    BEGIN
        CREATE TABLE Orders (
            OrderID NVARCHAR(50) PRIMARY KEY,
            OriginZone NVARCHAR(50) NOT NULL,
            DestinationZone NVARCHAR(50) NOT NULL,
            ServiceType NVARCHAR(50) NOT NULL,
            Status NVARCHAR(50) NOT NULL DEFAULT 'PENDING',
            Total DECIMAL(10, 2) NOT NULL,
            Breakdown NVARCHAR(MAX),
            InsuranceEnabled BIT NOT NULL DEFAULT 0,
            CreatedAt DATETIME2 NOT NULL DEFAULT GETDATE(),
            UpdatedAt DATETIME2 NOT NULL DEFAULT GETDATE()
        );

        CREATE INDEX IX_Orders_Status ON Orders(Status);
        CREATE INDEX IX_Orders_CreatedAt ON Orders(CreatedAt);
    END
    GO

    -- Create Packages table
    IF NOT EXISTS (SELECT * FROM sys.tables WHERE name = 'Packages')
    BEGIN
        CREATE TABLE Packages (
            PackageID INT IDENTITY(1,1) PRIMARY KEY,
            OrderID NVARCHAR(50) NOT NULL,
            WeightKg DECIMAL(10, 2) NOT NULL,
            Description NVARCHAR(500),
            FOREIGN KEY (OrderID) REFERENCES Orders(OrderID) ON DELETE CASCADE
        );

        CREATE INDEX IX_Packages_OrderID ON Packages(OrderID);
    END
    GO

    PRINT 'Database initialized successfully';
    GO
