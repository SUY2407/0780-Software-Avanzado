openapi: 3.0.3
info:
  title: EconoMarket - Users Auth Service
  version: 1.0.0
  description: |
    Microservicio de autenticación de usuarios para EconoMarket.
    Provee registro, login con JWT y obtención de perfil.

servers:
  - url: http://localhost:8080
    description: Desarrollo local

tags:
  - name: Auth
    description: Operaciones de autenticación

paths:
  /health:
    get:
      tags: [Auth]
      summary: Verifica el estado del servicio
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: users-auth-service

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Registro de usuario
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario creado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login de usuario
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Request inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Obtiene el usuario autenticado
      operationId: getCurrentUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Usuario actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Token ausente o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - first_name
        - last_name
        - nit
        - phone
        - role
      properties:
        email:
          type: string
          format: email
          example: dilan@economarket.gt
        password:
          type: string
          minLength: 6
          example: "123456"
        first_name:
          type: string
          example: Dilan
        last_name:
          type: string
          example: Garcia
        nit:
          type: string
          maxLength: 20
          example: "1758456789123"
        phone:
          type: string
          example: "+50253001234"
        role:
          type: string
          enum: [cliente, proveedor, admin]
          example: cliente

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: dilan@economarket.gt
        password:
          type: string
          example: "123456"

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: dilan@economarket.gt
        first_name:
          type: string
          example: Dilan
        last_name:
          type: string
          example: Garcia
        nit:
          type: string
          example: "1758456789123"
        phone:
          type: string
          example: "+50253001234"
        role:
          type: string
          example: cliente
        created_at:
          type: string
          format: date-time
          example: "2025-12-12T08:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2025-12-12T08:00:00Z"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT de autenticación
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Invalid credentials"
