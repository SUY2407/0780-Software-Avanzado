openapi: 3.0.3

info:
  title: FX Service API
  description: API para obtener tasas de cambio con fallback a cache
  version: "1.0.0"

servers:
  - url: http://localhost:8083

tags:
  - name: FX
    description: Operaciones de tipo de cambio
  - name: Health
    description: Healthchecks del servicio

paths:
  /fx/v1/rate:
    get:
      summary: Obtener tasa de cambio
      tags: [FX]
      parameters:
        - name: currency
          in: query
          required: true
          schema:
            type: string
            example: EUR
      responses:
        "200":
          description: Tasa obtenida correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FXRateResponse"
        "400":
          description: Moneda inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno o proveedor no disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /health/live:
    get:
      summary: Healthcheck liveness
      tags: [Health]
      responses:
        "200":
          description: Servicio activo

  /health/ready:
    get:
      summary: Healthcheck readiness
      tags: [Health]
      responses:
        "200":
          description: Servicio listo

components:
  schemas:
    FXRateResponse:
      type: object
      properties:
        rate:
          type: number
          format: float
          example: 0.92
        source:
          type: string
          example: LIVE
          enum: [LIVE, CACHE, UNAVAILABLE]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "currency not supported"
