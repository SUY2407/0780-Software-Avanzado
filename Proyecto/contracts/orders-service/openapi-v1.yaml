openapi: 3.0.3
info:
  title: Orders Service API
  description: EconoMarket Orders Microservice - Manages order creation, status updates, and retrieval
  version: 1.0.0
  contact:
    name: EconoMarket Team
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.economarket.com/orders
    description: Production server
  - url: http://localhost:3003
    description: Local development server
  - url: http://orders-service:3003
    description: Docker network server

tags:
  - name: orders
    description: Order management operations

paths:
  /api/v1/orders:
    post:
      tags:
        - orders
      summary: Create a new order
      description: Creates a new order with the provided items
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Bad request - Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - orders
      summary: Get all orders
      description: Retrieves a list of all orders
      operationId: getAllOrders
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Unauthorized - Invalid or missing authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders/from-cart:
    post:
      tags:
        - orders
      summary: Create order from user cart
      description: Creates an order using the items from the user's cart
      operationId: createOrderFromCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderFromCartRequest'
      responses:
        '201':
          description: Order created from cart successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Cart not found or empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders/{id}:
    get:
      tags:
        - orders
      summary: Get order by ID
      description: Retrieves a specific order by its UUID
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          description: Order UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{userId}/orders:
    get:
      tags:
        - orders
      summary: Get orders by user ID
      description: Retrieves all orders for a specific user
      operationId: getOrdersByUser
      parameters:
        - name: userId
          in: path
          required: true
          description: User ID
          schema:
            type: integer
      responses:
        '200':
          description: List of user orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Unauthorized - Invalid or missing authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/orders/{id}/status:
    put:
      tags:
        - orders
      summary: Update order status
      description: Updates the status of an existing order
      operationId: updateOrderStatus
      parameters:
        - name: id
          in: path
          required: true
          description: Order UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Order status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CreateOrderItemRequest:
      type: object
      required:
        - productId
        - productName
        - quantity
        - unitPrice
      properties:
        productId:
          type: integer
          description: Product ID
          example: 1
        productName:
          type: string
          description: Product name
          example: "Laptop HP"
        quantity:
          type: integer
          minimum: 1
          description: Quantity
          example: 2
        unitPrice:
          type: number
          format: double
          minimum: 0
          description: Unit price
          example: 999.99

    CreateOrderRequest:
      type: object
      required:
        - userId
        - items
      properties:
        userId:
          type: integer
          description: User ID
          example: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateOrderItemRequest'
        paymentReference:
          type: string
          description: Payment reference
          example: "PAY-123456"

    CreateOrderFromCartRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: integer
          description: User ID
          example: 1
        paymentReference:
          type: string
          description: Payment reference
          example: "PAY-123456"

    UpdateOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - PAID
            - SHIPPED
            - DELIVERED
            - CANCELLED
          description: New order status
          example: "CONFIRMED"

    OrderItemResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Item UUID
        productId:
          type: integer
          description: Product ID
        productName:
          type: string
          description: Product name
        quantity:
          type: integer
          description: Quantity
        unitPrice:
          type: number
          format: double
          description: Unit price
        subtotal:
          type: number
          format: double
          description: Subtotal (quantity * unitPrice)

    OrderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Order UUID
        userId:
          type: integer
          description: User ID
        total:
          type: number
          format: double
          description: Total amount
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - PAID
            - SHIPPED
            - DELIVERED
            - CANCELLED
          description: Order status
        paymentReference:
          type: string
          description: Payment reference
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp

    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Error message
        error:
          type: string
          description: Error type

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from the authentication service

security:
  - BearerAuth: []
