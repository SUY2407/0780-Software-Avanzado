apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        # ¡RECUERDA: Sube tu imagen a Docker Hub y pon tu usuario aquí!
        image: dcsm24/gateway-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        # Configuración de URLs hacia otros microservicios
        - name: USERS_SERVICE_URL
          value: "http://users-auth-service:80" # Apunta al Service de K8s, puerto 80
        - name: ORDERS_SERVICE_URL
          value: "http://orders-service:3000"   # (Cuando Melvin suba el suyo)
        - name: PORT
          value: "3000"
        
        # Probes (Usamos el endpoint /health que agregaste)
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
