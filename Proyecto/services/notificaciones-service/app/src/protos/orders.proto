syntax = "proto3";

package orders;

service OrdersService {
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse) {}
  rpc CreateOrderFromCart(CreateOrderFromCartRequest) returns (OrderResponse) {}
  rpc GetOrder(GetOrderRequest) returns (OrderResponse) {}
  rpc GetOrdersByUser(GetOrdersByUserRequest) returns (OrdersListResponse) {}
  rpc GetAllOrders(Empty) returns (OrdersListResponse) {}
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (OrderResponse) {}
}

message Empty {}

message OrderItemRequest {
  int32 product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  double unit_price = 4;
}

message CreateOrderRequest {
  int32 user_id = 1;
  repeated OrderItemRequest items = 2;
}

message CreateOrderFromCartRequest {
  int32 user_id = 1;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrdersByUserRequest {
  int32 user_id = 1;
}

message UpdateOrderStatusRequest {
  string order_id = 1;
  string status = 2;
  string payment_reference = 3;
}

message OrderItemResponse {
  string id = 1;
  int32 product_id = 2;
  string product_name = 3;
  int32 quantity = 4;
  double unit_price = 5;
  double subtotal = 6;
}

message OrderResponse {
  string id = 1;
  int32 user_id = 2;
  double total = 3;
  string status = 4;
  string payment_reference = 5;
  repeated OrderItemResponse items = 6;
  string created_at = 7;
  string updated_at = 8;
}

message OrdersListResponse {
  repeated OrderResponse orders = 1;
}
