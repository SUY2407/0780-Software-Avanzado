apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image:  melvinv404/g12-gateway-service:latest  # ← V13 con 7 servicios
        # image: dcsm24/gateway-service:v25  # ← V13 con 7 servicios
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:  # ← 7 SERVICIOS + PORT
        - name: USERSSERVICEURL
          value: "http://users-auth-service:80"
        - name: ORDERSSERVICEURL
          value: "http://orders-service:8084"
        - name: CATALOGSERVICEURL
          value: "http://catalog-service:8081"
        - name: FXSERVICEURL
          value: "http://fx-service:8083"
        - name: INTEGRATIONSSERVICEURL
          value: "http://catalog-integrations:8091"
        - name: CARTCHECKOUTSERVICEURL
          value: "http://cart-checkout-service:8086"
        - name: PAYMENTSERVICEURL  # ← NUEVO Payment Service
          value: "http://payment-service:8000"
        - name: PORT
          value: "3000"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
