apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: sebastianhigueros/g12-payment-service:1.0.0
          ports:
            - name: grpc
              containerPort: 8082
            - name: rest
              containerPort: 8000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          envFrom:
            - secretRef:
                name: payment-service-secrets
            - configMapRef:
                name: payment-service-config
