apiVersion: v1
kind: Service
metadata:
  name: users-auth-service
spec:
  selector:
    app: users-auth
  ports:
    - name: http
      protocol: TCP
      port: 80     # Otros servicios te llaman al puerto 80
      targetPort: 8080
    - name: grpc
      protocol: TCP
      port: 50051  # Puerto para gRPC
      targetPort: 50051
