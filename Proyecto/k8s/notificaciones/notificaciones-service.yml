apiVersion: v1
kind: Service
metadata:
  name: notificaciones-service
  labels:
    app: notificaciones
spec:
  selector:
    app: notificaciones
  ports:
    - name: http
      protocol: TCP
      port: 8087
      targetPort: 8087
    - name: grpc
      protocol: TCP
      port: 50056
      targetPort: 50056
